{% if delta %}
  <span class="kpi-delta is-{{ delta.direction }}">
    <i data-lucide="{% if delta.direction == 'up' %}trending-up{% elif delta.direction == 'down' %}trending-down{% else %}minus{% endif %}" aria-hidden="true"></i>
    <span>{{ delta.sign }}{{ delta.value|floatformat:1 }}{{ delta.unit }} vs. período anterior</span>
  </span>
{% elif comparable %}
  <span class="kpi-delta is-flat">
    <i data-lucide="minus" aria-hidden="true"></i>
    <span>Sin datos del período anterior</span>
  </span>
{% endif %}
