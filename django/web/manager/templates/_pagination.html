{% if is_paginated %}
  <nav class="pagination" aria-label="Paginacion">
    {% if page_obj.has_previous %}
      <a href="?{% if list_querystring %}{{ list_querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>
    {% endif %}

    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>

    {% if page_obj.has_next %}
      <a href="?{% if list_querystring %}{{ list_querystring }}&{% endif %}page={{ page_obj.next_page_number }}">Siguiente</a>
    {% endif %}
  </nav>
{% endif %}
