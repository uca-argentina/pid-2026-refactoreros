{% extends "manager_base.html" %}

{% block content %}
  <section class="page-heading">
    <p>{{ section }}</p>
    <h1>Eliminar {{ object_label|lower }}</h1>
  </section>

  <form class="manager-form danger-form" method="post">
    {% csrf_token %}
    <div class="delete-warning">
      <i data-lucide="triangle-alert" aria-hidden="true"></i>
      <div>
        <h2>Confirmar eliminación</h2>
        <p>Vas a eliminar <strong>{{ object }}</strong>. Esta acción no se puede deshacer desde el panel.</p>
      </div>
    </div>
    <div class="form-actions">
      <button class="danger" type="submit">
        <i data-lucide="trash-2" aria-hidden="true"></i>
        <span>Eliminar</span>
      </button>
      <a href="../">Cancelar</a>
    </div>
  </form>
{% endblock %}
