<form class="list-controles" method="get" data-auto-filter-form>
  <label class="search-field">
    <span>Buscar</span>
    <i data-lucide="search" aria-hidden="true"></i>
    <input type="search" name="q" value="{{ search_query }}" placeholder="{{ search_placeholder }}">
  </label>

  <label>
    <span>Por página</span>
    <select name="per_page">
      {% for option in page_size_options %}
        <option value="{{ option }}"{% if option == page_size %} selected{% endif %}>{{ option }}</option>
      {% endfor %}
    </select>
  </label>

  {% if ordering_options %}
    <label>
      <span>Ordenar por</span>
      <select name="order">
        {% for option in ordering_options %}
          <option value="{{ option.0 }}"{% if option.0 == selected_ordering %} selected{% endif %}>{{ option.1 }}</option>
        {% endfor %}
      </select>
    </label>
  {% endif %}

  {% if has_list_filters %}
    <a href="{{ request.path }}" class="ghost-link">
      <i data-lucide="x" aria-hidden="true"></i>
      <span>Limpiar</span>
    </a>
  {% endif %}
</form>
<script>
  (function () {
    var form = document.querySelector("[data-auto-filter-form]");
    if (!form) {
      return;
    }
    form.querySelectorAll("select").forEach(function (select) {
      select.addEventListener("change", function () {
        form.submit();
      });
    });
    var searchInput = form.querySelector('input[type="search"]');
    var searchTimeout = null;
    var lastSubmittedSearch = searchInput ? searchInput.value : "";
    if (searchInput) {
      searchInput.addEventListener("input", function () {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function () {
          if (searchInput.value === lastSubmittedSearch) {
            return;
          }
          lastSubmittedSearch = searchInput.value;
          form.submit();
        }, 450);
      });
    }
  })();
</script>
