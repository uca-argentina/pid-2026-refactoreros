{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ cinema.nombre }} | Home</title>
  <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
  <link rel="icon" href="{% static 'favicon.png' %}" type="image/png">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #111827;
      background: #f5f7fb;
    }

    main {
      width: min(640px, calc(100% - 32px));
      padding: 32px;
      border: 1px solid #d9dee8;
      background: #fff;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
    }

    p {
      margin: 0 0 24px;
      color: #6b7280;
    }

    a {
      color: #111827;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>{{ cinema.nombre }}</h1>
    <p>Home inicial. Todavía no hay contenido cargado.</p>
    <a href="{% url 'logout' %}">Cerrar sesión</a>
  </main>
</body>
</html>
