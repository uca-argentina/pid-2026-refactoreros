{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ cinema.name }} | Cartelera</title>
  <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
  <link rel="icon" href="{% static 'favicon.png' %}" type="image/png">
  <link rel="stylesheet" href="{% static 'catalog.css' %}">
</head>
<body class="client-page">
  {% include "_client_header.html" %}

  <main class="client-main">
    {% if movies %}
      <section class="movie-grid" aria-label="Peliculas con funciones publicadas">
        {% for movie in movies %}
          <a class="movie-card" href="{% url 'movie_detail' movie.pk %}">
            <img src="{{ movie.image.url }}" alt="{{ movie.title }}">
            <div class="movie-card-body">
              <h2>{{ movie.title }}</h2>
              <p>{{ movie.get_rating_display }}</p>
            </div>
          </a>
        {% endfor %}
      </section>
    {% else %}
      <section class="client-empty">
        <h2>No hay funciones publicadas</h2>
        <p>Volvé mas tarde para ver la próxima cartelera.</p>
      </section>
    {% endif %}
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
