name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-tests:
    name: Django tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: butacacero
          POSTGRES_USER: butacacero
          POSTGRES_PASSWORD: butacacero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U butacacero -d butacacero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://butacacero:butacacero@localhost:5432/butacacero
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-secret-key

    defaults:
      run:
        working-directory: django

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: django/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test
